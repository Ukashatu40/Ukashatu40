<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Ukashatu Abdullahi software engineering profile</title>
  <desc id="desc">Software Engineer, Full-Stack, Backend and Systems focus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1118"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1f2937" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="372" rx="18" fill="url(#grid)" opacity="0.55"/>
  <rect x="60" y="58" width="8" height="284" rx="4" fill="#2dd4bf"/>
  <text x="102" y="122" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing="2">SOFTWARE ENGINEER / FULL-STACK / SYSTEMS</text>
  <text x="100" y="200" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="800">UKASHATU ABDULLAHI</text>
  <text x="102" y="250" fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24">Building products across interface, API, data &amp; infrastructure.</text>
  <g transform="translate(870 95)">
