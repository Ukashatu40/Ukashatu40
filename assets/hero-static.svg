    <circle cx="100" cy="100" r="56" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-dasharray="7 9"/>
    <circle cx="100" cy="20" r="6" fill="#2dd4bf"/>
    <circle cx="171" cy="141" r="6" fill="#60a5fa"/>
    <circle cx="35" cy="151" r="6" fill="#f59e0b"/>
    <path d="M100 20L171 141L35 151Z" fill="none" stroke="#475569" stroke-width="2"/>
    <text x="100" y="105" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">SHIP</text>
