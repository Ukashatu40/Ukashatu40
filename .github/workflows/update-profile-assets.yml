name: Update profile assets

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update generated profile assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: Ukashatu40
        run: node scripts/update-profile-assets.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg
          git diff --cached --quiet || git commit -m "chore: refresh GitHub profile assets"
          git push
